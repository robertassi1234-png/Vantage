services:
  - type: web
    name: vantage-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Pinned so the deploy runs the interpreter the tests run on. Without
      # this the host picks its current default, which moves: a Python newer
      # than a dependency has wheels for turns `pip install` into a source
      # build and fails the whole deploy.
      - key: PYTHON_VERSION
        value: "3.12.7"

      - key: FMP_API_KEY
        sync: false

      # Optional extra market-data providers. Each is another free tier to
      # fall through to when an earlier one runs out; leave blank to skip.
      - key: FINNHUB_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # Accounts. Without DATABASE_URL the app falls back to a file on the
      # instance's disk, which a free plan wipes on every restart -- fine for
      # trying it out, but sign-ins would not survive.
      - key: DATABASE_URL
        sync: false

      # Must name the site exactly. A cookie plus an "any origin" setting
      # would let any website read a signed-in reader's watchlist, so sign-in
      # stays off until this is a real address.
      - key: CORS_ORIGINS
        sync: false

      # Where sign-in links point back to: the site's address, not the API's.
      - key: APP_BASE_URL
        sync: false

      # Email delivery, for sign-in links and price alerts.
      #
      # Prefer RESEND_API_KEY: free hosting blocks outbound SMTP ports to
      # deter spam, so SMTP times out here no matter how it is configured.
      # HTTPS is never blocked.
      - key: RESEND_API_KEY
        sync: false

      # SMTP remains for anywhere that allows it, or another provider.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Shared secret for the scheduled alert sweep, so only your scheduler
      # can trigger it. Generated once; paste the same value into the
      # repository secret named CRON_SECRET.
      - key: CRON_SECRET
        generateValue: true

      - key: FUNDAMENTALS_CACHE_HOURS
        value: "24"

  - type: web
    name: vantage-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # The sign-in link arrives as /signin?token=..., which is handled by the
      # app rather than by a file on disk.
      - type: rewrite
        source: /*
        destination: /index.html
