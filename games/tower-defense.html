<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridlock Defense</title>
<style>
  :root {
    --bg: #0f1218;
    --panel: #181c25;
    --panel-2: #1f2430;
    --border: #2b3140;
    --text: #e6e9ef;
    --muted: #8a93a6;
    --accent: #f5b942;
    --good: #4cd17a;
    --bad: #ff5d5d;
    --blue: #5aa9ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    -webkit-user-select: none; user-select: none;
  }
  #app {
    display: flex; gap: 12px; padding: 12px;
    justify-content: center; align-items: flex-start;
    flex-wrap: wrap;
  }
  #stage { position: relative; }
  canvas {
    display: block;
    background: #141a22;
    border: 2px solid var(--border);
    border-radius: 6px;
    cursor: crosshair;
    image-rendering: auto;
  }
  #side {
    width: 260px; display: flex; flex-direction: column; gap: 10px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
  }
  .card h3 {
    margin: 0 0 8px; font-size: 12px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .stat { display: flex; justify-content: space-between; }
  .stat b { font-variant-numeric: tabular-nums; }
  .gold { color: var(--accent); } .lives { color: var(--bad); } .wave { color: var(--blue); }
  button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #1a1200; border-color: var(--accent); font-weight: 700; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }
  button.danger { border-color: var(--bad); color: var(--bad); }
  .row { display: flex; gap: 6px; }
  .row > button { flex: 1; }
  .tower-btn {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    margin-bottom: 6px; padding: 8px;
  }
  .tower-btn.selected { border-color: var(--accent); background: #2a2a1c; }
  .tower-btn .swatch { width: 22px; height: 22px; border-radius: 4px; flex: none; }
  .tower-btn .name { font-weight: 600; }
  .tower-btn .desc { color: var(--muted); font-size: 12px; }
  .tower-btn .cost { margin-left: auto; color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
  .kv { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; }
  .kv b { color: var(--text); }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.4; }
  kbd {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px;
    padding: 0 4px; font-size: 11px;
  }
  #preview { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 8px; font-size: 12px;
  }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(8, 10, 14, .82); border-radius: 6px;
  }
  #overlay.show { display: flex; }
  #overlay .box {
    text-align: center; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px 32px; min-width: 300px;
  }
  #overlay h1 { margin: 0 0 6px; font-size: 26px; }
  #overlay p { margin: 4px 0; color: var(--muted); }
  #overlay .big { color: var(--text); font-size: 18px; }
  select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px; font: inherit; width: 100%;
  }
  #toast {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    background: rgba(20, 24, 32, .95); border: 1px solid var(--border);
    color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 13px;
    pointer-events: none; opacity: 0; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="800" height="480"></canvas>
    <div id="toast"></div>
    <div id="overlay">
      <div class="box">
        <h1 id="ov-title">Gridlock Defense</h1>
        <p id="ov-sub">Hold the line. Enemies follow the road to your base.</p>
        <p class="big" id="ov-score"></p>
        <p id="ov-best"></p>
        <div style="margin:12px 0 6px; text-align:left;">
          <label class="hint" for="map-select">Map</label>
          <select id="map-select"></select>
        </div>
        <button class="primary" id="ov-btn" style="width:100%; margin-top:8px;">Start Game</button>
      </div>
    </div>
  </div>

  <div id="side">
    <div class="card">
      <div class="stats">
        <div class="stat"><span>Gold</span><b class="gold" id="ui-gold">0</b></div>
        <div class="stat"><span>Lives</span><b class="lives" id="ui-lives">0</b></div>
        <div class="stat"><span>Wave</span><b class="wave" id="ui-wave">0</b></div>
        <div class="stat"><span>Best</span><b id="ui-best">0</b></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="primary" id="btn-wave">Start Wave 1</button>
        <button id="btn-speed" title="Toggle game speed">1x</button>
        <button id="btn-pause" title="Pause (P)">II</button>
      </div>
      <div style="margin-top:8px;">
        <div class="hint">Next wave:</div>
        <div id="preview"></div>
      </div>
    </div>

    <div class="card">
      <h3>Build</h3>
      <div id="tower-list"></div>
      <div class="hint">Keys <kbd>1</kbd>–<kbd>4</kbd> select, <kbd>Esc</kbd> cancels, <kbd>Space</kbd> starts wave.</div>
    </div>

    <div class="card" id="info-card">
      <h3 id="info-title">Selected</h3>
      <div id="info-body" class="hint">Click a placed tower to inspect, upgrade or sell it.</div>
    </div>

    <div class="card">
      <div class="row">
        <button id="btn-mute">Sound: On</button>
        <button class="danger" id="btn-restart">Restart</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
 *  GRIDLOCK DEFENSE — single-file canvas tower defense
 *
 *  Sections:
 *    1. Constants & data (maps, towers, enemies)
 *    2. Game state
 *    3. Audio (Web Audio beeps)
 *    4. Wave generation
 *    5. Enemy logic (path following, damage, death)
 *    6. Tower logic (targeting, firing, upgrades)
 *    7. Projectiles & particles
 *    8. Rendering
 *    9. Input & UI
 *   10. Game loop
 * ===================================================================== */

/* ---------------------------------------------------------------------
 * 1. CONSTANTS & DATA
 * ------------------------------------------------------------------- */
const TILE = 40;
const COLS = 20;
const ROWS = 12;
const W = COLS * TILE;
const H = ROWS * TILE;

const START_GOLD = 150;
const START_LIVES = 20;
const SELL_REFUND = 0.7;
const ENDLESS_AFTER = 30;   // after this wave the game announces "endless mode"

// Each map is a list of grid coordinates; consecutive coords must be
// orthogonally adjacent (the enemy walks tile centre to tile centre).
// Start is the first entry (should sit on an edge), base is the last.
const MAPS = [
  {
    name: 'Switchback',
    path: buildPath([
      [0, 1], [5, 1], [5, 4], [2, 4], [2, 7], [8, 7], [8, 2], [12, 2],
      [12, 9], [15, 9], [15, 4], [18, 4], [18, 10], [19, 10],
    ]),
  },
  {
    name: 'Serpent',
    path: buildPath([
      [0, 6], [3, 6], [3, 1], [7, 1], [7, 10], [11, 10], [11, 3], [14, 3],
      [14, 8], [17, 8], [17, 1], [19, 1],
    ]),
  },
];

// Expands a list of corner points into every tile between them.
function buildPath(corners) {
  const out = [];
  for (let i = 0; i < corners.length; i++) {
    const [cx, cy] = corners[i];
    if (i === 0) { out.push([cx, cy]); continue; }
    let [px, py] = corners[i - 1];
    const dx = Math.sign(cx - px), dy = Math.sign(cy - py);
    while (px !== cx || py !== cy) {
      px += dx; py += dy;
      out.push([px, py]);
    }
  }
  return out;
}

// Tower definitions. `tiers` lists cumulative upgrade levels; level 0 is base.
// Range is in pixels, fireRate is shots per second.
const TOWER_TYPES = {
  basic: {
    name: 'Gun Turret', key: '1', color: '#5aa9ff', desc: 'Cheap all-rounder.',
    cost: 50,
    tiers: [
      { damage: 12, range: 110, fireRate: 2.4 },
      { damage: 18, range: 120, fireRate: 2.8, cost: 40 },
      { damage: 28, range: 130, fireRate: 3.2, cost: 70 },
      { damage: 42, range: 145, fireRate: 3.8, cost: 110 },
    ],
    projectile: { speed: 520, radius: 3, color: '#cfe6ff' },
  },
  sniper: {
    name: 'Sniper', key: '2', color: '#f5b942', desc: 'Long range, big hits, slow.',
    cost: 110,
    tiers: [
      { damage: 70, range: 230, fireRate: 0.55 },
      { damage: 120, range: 260, fireRate: 0.6, cost: 80 },
      { damage: 200, range: 290, fireRate: 0.7, cost: 140 },
      { damage: 340, range: 320, fireRate: 0.8, cost: 220 },
    ],
    projectile: { speed: 1100, radius: 3, color: '#fff2c4' },
  },
  splash: {
    name: 'Mortar', key: '3', color: '#ff7a59', desc: 'Short range, area damage.',
    cost: 90,
    tiers: [
      { damage: 26, range: 95, fireRate: 0.9, splash: 48 },
      { damage: 40, range: 100, fireRate: 1.0, splash: 54, cost: 70 },
      { damage: 60, range: 108, fireRate: 1.1, splash: 62, cost: 120 },
      { damage: 95, range: 118, fireRate: 1.25, splash: 72, cost: 190 },
    ],
    projectile: { speed: 300, radius: 5, color: '#ffb59e', arc: true },
  },
  frost: {
    name: 'Frost', key: '4', color: '#7fe7ff', desc: 'Slows enemies in range.',
    cost: 75,
    tiers: [
      { damage: 4, range: 100, fireRate: 1.6, slow: 0.4, slowTime: 1.6 },
      { damage: 6, range: 110, fireRate: 1.8, slow: 0.5, slowTime: 1.9, cost: 60 },
      { damage: 9, range: 120, fireRate: 2.0, slow: 0.58, slowTime: 2.2, cost: 100 },
      { damage: 14, range: 135, fireRate: 2.3, slow: 0.65, slowTime: 2.6, cost: 160 },
    ],
    projectile: { speed: 420, radius: 3, color: '#dbfbff' },
  },
};

// Enemy definitions. hp/speed/reward are base values scaled per wave.
const ENEMY_TYPES = {
  basic:   { name: 'Grunt',   hp: 60,  speed: 60,  reward: 6,  radius: 10, color: '#c95d5d' },
  fast:    { name: 'Runner',  hp: 32,  speed: 115, reward: 5,  radius: 8,  color: '#e8d55a' },
  tank:    { name: 'Brute',   hp: 260, speed: 36,  reward: 16, radius: 14, color: '#7a5fd1' },
  shield:  { name: 'Warden',  hp: 90,  speed: 55,  reward: 10, radius: 11, color: '#4fb8a8', shield: 60 },
  splitter:{ name: 'Blob',    hp: 110, speed: 50,  reward: 8,  radius: 12, color: '#79c85a', splits: 2 },
  spawn:   { name: 'Blobling',hp: 30,  speed: 75,  reward: 2,  radius: 7,  color: '#a5e08a' },
  boss:    { name: 'Colossus',hp: 1400,speed: 30,  reward: 90, radius: 18, color: '#ff4d8d', boss: true },
};

/* ---------------------------------------------------------------------
 * 2. GAME STATE
 * ------------------------------------------------------------------- */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const G = {
  mapIndex: 0,
  path: [],            // grid coords
  waypoints: [],       // pixel centres of path tiles
  pathSet: new Set(),  // "x,y" strings for quick lookup
  grid: [],            // grid[y][x] -> tower or null
  towers: [],
  enemies: [],
  projectiles: [],
  particles: [],
  floaters: [],        // floating text (gold, etc.)
  gold: START_GOLD,
  lives: START_LIVES,
  wave: 0,             // last started wave number
  waveActive: false,
  spawnQueue: [],      // {type, delay}
  spawnTimer: 0,
  speed: 1,
  paused: false,
  over: false,
  started: false,
  bestWave: 0,         // in-memory high score
  selectedType: null,  // tower type chosen to place
  selectedTower: null, // placed tower being inspected
  hover: { x: -1, y: -1 },
  time: 0,
  shake: 0,
  endlessAnnounced: false,
};

function loadMap(index) {
  G.mapIndex = index;
  G.path = MAPS[index].path;
  G.pathSet = new Set(G.path.map(([x, y]) => `${x},${y}`));
  G.waypoints = G.path.map(([x, y]) => ({ x: x * TILE + TILE / 2, y: y * TILE + TILE / 2 }));
  G.grid = [];
  for (let y = 0; y < ROWS; y++) G.grid.push(new Array(COLS).fill(null));
}

function resetGame() {
  loadMap(G.mapIndex);
  G.towers = []; G.enemies = []; G.projectiles = []; G.particles = []; G.floaters = [];
  G.gold = START_GOLD; G.lives = START_LIVES; G.wave = 0;
  G.waveActive = false; G.spawnQueue = []; G.spawnTimer = 0;
  G.paused = false; G.over = false; G.started = true;
  G.selectedType = null; G.selectedTower = null;
  G.time = 0; G.shake = 0; G.endlessAnnounced = false;
  updateUI();
}

/* ---------------------------------------------------------------------
 * 3. AUDIO — tiny oscillator beeps, no external files
 * ------------------------------------------------------------------- */
const Audio = {
  ctx: null, muted: false, lastShot: 0, lastKill: 0,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; }
  },
  beep(freq, dur = 0.06, type = 'square', vol = 0.04, slide = 0) {
    if (this.muted || !this.ctx) return;
    if (this.ctx.state === 'suspended') { this.ctx.resume(); return; }
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(this.ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
  },
  shoot(type) {
    // Rate-limit: many towers firing at 2x would otherwise create hundreds
    // of oscillator nodes per second.
    const now = performance.now();
    if (now - this.lastShot < 45) return;
    this.lastShot = now;
    if (type === 'sniper') this.beep(900, 0.08, 'sawtooth', 0.03, -600);
    else if (type === 'splash') this.beep(180, 0.12, 'triangle', 0.05, -100);
    else if (type === 'frost') this.beep(1200, 0.05, 'sine', 0.025, 300);
    else this.beep(600, 0.04, 'square', 0.02, -200);
  },
  kill() {
    const now = performance.now();
    if (now - this.lastKill < 60) return;
    this.lastKill = now;
    this.beep(320, 0.1, 'triangle', 0.04, -200);
  },
  place() { this.beep(440, 0.08, 'sine', 0.05, 220); },
  upgrade() { this.beep(520, 0.07, 'sine', 0.05, 300); setTimeout(() => this.beep(780, 0.1, 'sine', 0.05, 200), 70); },
  sell() { this.beep(500, 0.08, 'sine', 0.04, -250); },
  error() { this.beep(150, 0.12, 'square', 0.04, -40); },
  leak() { this.beep(220, 0.2, 'sawtooth', 0.05, -120); },
  wave() { this.beep(440, 0.1, 'square', 0.04, 0); setTimeout(() => this.beep(660, 0.14, 'square', 0.04, 0), 110); },
  gameOver() { [440, 370, 311, 220].forEach((f, i) => setTimeout(() => this.beep(f, 0.25, 'sawtooth', 0.05), i * 180)); },
};

/* ---------------------------------------------------------------------
 * 4. WAVE GENERATION
 *   Waves are built procedurally from the wave number so the game can go
 *   on forever. Every 5th wave is a boss wave. Composition escalates:
 *   more enemies, new types unlock, and per-enemy stats scale up.
 * ------------------------------------------------------------------- */
function waveScaling(n) {
  // hp compounds ~14% per wave (so late waves outpace a maxed-out defence),
  // speed grows slowly and caps, rewards grow sub-linearly so gold stays tight.
  return {
    hp: Math.pow(1.14, n - 1),
    speed: Math.min(1.7, 1 + 0.025 * (n - 1)),
    reward: 1 + 0.04 * (n - 1),
  };
}

function buildWave(n) {
  // Returns a spawn queue: array of {type, delay} where delay is the gap
  // (seconds) before this enemy spawns.
  const q = [];
  const push = (type, count, gap) => { for (let i = 0; i < count; i++) q.push({ type, delay: gap }); };

  if (n % 5 === 0) {
    // Boss wave: escort + a boss (two bosses past wave 20)
    push('basic', 4 + n, 0.55);
    push('boss', n >= 20 ? 2 : 1, 2.0);
    push('fast', 4 + Math.floor(n / 2), 0.35);
    return q;
  }

  const basics = 6 + Math.floor(n * 1.6);
  push('basic', basics, Math.max(0.35, 0.8 - n * 0.02));
  if (n >= 2) push('fast', 3 + Math.floor(n * 0.9), 0.3);
  if (n >= 4) push('tank', 1 + Math.floor(n / 3), 1.1);
  if (n >= 7) push('shield', 2 + Math.floor(n / 4), 0.7);
  if (n >= 9) push('splitter', 1 + Math.floor(n / 5), 0.9);
  if (n >= 12) push('fast', 4 + Math.floor(n / 2), 0.22);
  if (n >= 16) push('tank', Math.floor(n / 4), 0.9);
  if (n >= 18) push('shield', Math.floor((n - 14) / 2), 0.5);
  if (n >= 22) push('splitter', Math.floor((n - 18) / 2), 0.6);
  if (n >= 25) push('tank', Math.floor((n - 20) / 2), 0.6);

  // Interleave a bit so groups aren't perfectly blocky
  for (let i = q.length - 1; i > 0; i--) {
    if (Math.random() < 0.35) {
      const j = Math.max(0, i - 3 - Math.floor(Math.random() * 3));
      [q[i], q[j]] = [q[j], q[i]];
    }
  }
  return q;
}

function waveSummary(n) {
  const counts = {};
  for (const e of buildWave(n)) counts[e.type] = (counts[e.type] || 0) + 1;
  return counts;
}

function startWave() {
  if (G.over || !G.started) return;
  if (G.waveActive) return;
  G.wave++;
  G.spawnQueue = buildWave(G.wave);
  G.spawnTimer = 0.4;
  G.waveActive = true;
  G.paused = false;
  Audio.wave();
  if (G.wave > ENDLESS_AFTER && !G.endlessAnnounced) {
    G.endlessAnnounced = true;
    toast('Endless mode: how far can you go?');
  } else if (G.wave % 5 === 0) {
    toast('Boss wave incoming!');
  }
  updateUI();
}

/* ---------------------------------------------------------------------
 * 5. ENEMY LOGIC
 * ------------------------------------------------------------------- */
let nextId = 1;

function spawnEnemy(type, opts = {}) {
  const def = ENEMY_TYPES[type];
  const s = waveScaling(G.wave);
  const hp = Math.round(def.hp * s.hp);
  const e = {
    id: nextId++,
    type, def,
    hp, maxHp: hp,
    shield: def.shield ? Math.round(def.shield * s.hp) : 0,
    maxShield: def.shield ? Math.round(def.shield * s.hp) : 0,
    baseSpeed: def.speed * s.speed,
    reward: Math.max(1, Math.round(def.reward * s.reward)),
    radius: def.radius,
    // Path-following state: enemy is moving toward waypoint[seg].
    seg: opts.seg ?? 1,
    x: opts.x ?? G.waypoints[0].x,
    y: opts.y ?? G.waypoints[0].y,
    dist: opts.dist ?? 0,   // total distance travelled — used for "first" targeting
    slow: 0, slowTimer: 0,  // slow multiplier & time remaining
    hitFlash: 0,
    dead: false,
    wobble: Math.random() * Math.PI * 2,
  };
  G.enemies.push(e);
  return e;
}

// Move each enemy along the fixed path. We walk toward the current target
// waypoint; if we overshoot it this frame, we carry the leftover distance
// into the next segment so speed stays consistent around corners.
function updateEnemies(dt) {
  for (const e of G.enemies) {
    if (e.dead) continue;
    if (e.slowTimer > 0) { e.slowTimer -= dt; if (e.slowTimer <= 0) e.slow = 0; }
    if (e.hitFlash > 0) e.hitFlash -= dt;
    e.wobble += dt * 6;

    let remaining = e.baseSpeed * (1 - e.slow) * dt;
    while (remaining > 0 && e.seg < G.waypoints.length) {
      const wp = G.waypoints[e.seg];
      const dx = wp.x - e.x, dy = wp.y - e.y;
      const d = Math.hypot(dx, dy);
      if (d <= remaining) {
        e.x = wp.x; e.y = wp.y; e.dist += d; remaining -= d; e.seg++;
      } else {
        e.x += dx / d * remaining; e.y += dy / d * remaining; e.dist += remaining; remaining = 0;
      }
    }
    if (e.seg >= G.waypoints.length) {
      // Reached the base
      e.dead = true;
      G.lives -= e.def.boss ? 5 : 1;
      G.shake = 0.25;
      Audio.leak();
      spawnParticles(e.x, e.y, '#ff5d5d', 14);
      if (G.lives <= 0) { G.lives = 0; gameOver(); }
      updateUI();
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead);
}

function damageEnemy(e, amount, source) {
  if (e.dead) return;
  e.hitFlash = 0.08;
  if (e.shield > 0) {
    const absorbed = Math.min(e.shield, amount);
    e.shield -= absorbed; amount -= absorbed;
    if (absorbed > 0) spawnParticles(e.x, e.y, '#9ff2e6', 2, 40);
  }
  e.hp -= amount;
  if (e.hp <= 0) killEnemy(e, source);
}

function killEnemy(e, source) {
  if (e.dead) return;
  e.dead = true;
  G.gold += e.reward;
  if (source) source.kills++;
  Audio.kill();
  spawnParticles(e.x, e.y, e.def.color, e.def.boss ? 40 : 12, e.def.boss ? 160 : 90);
  floater(e.x, e.y - 14, `+${e.reward}`, '#f5b942');
  if (e.def.splits) {
    // Splitter: pop out smaller enemies at the same path position
    for (let i = 0; i < e.def.splits; i++) {
      const s = spawnEnemy('spawn', { seg: e.seg, x: e.x + (i ? 8 : -8), y: e.y, dist: e.dist });
      s.hp = s.maxHp; // fresh
    }
  }
  updateUI();
}

/* ---------------------------------------------------------------------
 * 6. TOWER LOGIC
 * ------------------------------------------------------------------- */
function towerStats(t) { return TOWER_TYPES[t.type].tiers[t.level]; }

function towerValue(t) {
  // Total gold sunk into this tower
  const def = TOWER_TYPES[t.type];
  let v = def.cost;
  for (let i = 1; i <= t.level; i++) v += def.tiers[i].cost;
  return v;
}

function canBuildAt(gx, gy) {
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return false;
  if (G.pathSet.has(`${gx},${gy}`)) return false;
  if (G.grid[gy][gx]) return false;
  return true;
}

function placeTower(type, gx, gy) {
  const def = TOWER_TYPES[type];
  if (!canBuildAt(gx, gy)) { Audio.error(); flashTile(gx, gy); return false; }
  if (G.gold < def.cost) { Audio.error(); toast('Not enough gold'); flashTile(gx, gy); return false; }
  G.gold -= def.cost;
  const t = {
    id: nextId++, type, level: 0,
    gx, gy, x: gx * TILE + TILE / 2, y: gy * TILE + TILE / 2,
    cooldown: 0, angle: -Math.PI / 2, kills: 0, recoil: 0, placedAt: G.time,
  };
  G.towers.push(t);
  G.grid[gy][gx] = t;
  Audio.place();
  spawnParticles(t.x, t.y, def.color, 10, 60);
  updateUI();
  return true;
}

function upgradeTower(t) {
  const def = TOWER_TYPES[t.type];
  if (t.level >= def.tiers.length - 1) return;
  const cost = def.tiers[t.level + 1].cost;
  if (G.gold < cost) { Audio.error(); toast('Not enough gold'); return; }
  G.gold -= cost;
  t.level++;
  Audio.upgrade();
  spawnParticles(t.x, t.y, '#ffffff', 14, 80);
  floater(t.x, t.y - 20, 'Upgraded!', '#fff');
  updateUI();
}

function sellTower(t) {
  const refund = Math.round(towerValue(t) * SELL_REFUND);
  G.gold += refund;
  G.grid[t.gy][t.gx] = null;
  G.towers = G.towers.filter(x => x !== t);
  if (G.selectedTower === t) G.selectedTower = null;
  Audio.sell();
  floater(t.x, t.y - 10, `+${refund}`, '#f5b942');
  updateUI();
}

// Targeting: pick the enemy in range that is furthest along the path
// ("first"). Sniper prefers the highest HP target in range ("strong")
// so its big hits aren't wasted on runners. Frost prefers unslowed
// enemies so it spreads the debuff.
function findTarget(t) {
  const st = towerStats(t);
  const r2 = st.range * st.range;
  let best = null, bestScore = -Infinity;
  for (const e of G.enemies) {
    if (e.dead) continue;
    const dx = e.x - t.x, dy = e.y - t.y;
    if (dx * dx + dy * dy > r2) continue;
    let score;
    if (t.type === 'sniper') score = e.hp + e.shield;
    else if (t.type === 'frost') score = (e.slow > 0 ? 0 : 100000) + e.dist;
    else score = e.dist;
    if (score > bestScore) { bestScore = score; best = e; }
  }
  return best;
}

function updateTowers(dt) {
  for (const t of G.towers) {
    const st = towerStats(t);
    t.cooldown -= dt;
    if (t.recoil > 0) t.recoil -= dt * 6;
    const target = findTarget(t);
    if (target) {
      const desired = Math.atan2(target.y - t.y, target.x - t.x);
      // ease the barrel toward the target
      let diff = desired - t.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      t.angle += diff * Math.min(1, dt * 18);
      if (t.cooldown <= 0) {
        t.cooldown = 1 / st.fireRate;
        t.recoil = 1;
        fireProjectile(t, target);
      }
    }
  }
}

/* ---------------------------------------------------------------------
 * 7. PROJECTILES & PARTICLES
 * ------------------------------------------------------------------- */
function fireProjectile(t, target) {
  const def = TOWER_TYPES[t.type];
  const st = towerStats(t);
  const p = def.projectile;
  const muzzle = 14;
  const proj = {
    x: t.x + Math.cos(t.angle) * muzzle,
    y: t.y + Math.sin(t.angle) * muzzle,
    target, tower: t, type: t.type,
    speed: p.speed, radius: p.radius, color: p.color,
    damage: st.damage, splash: st.splash || 0,
    slow: st.slow || 0, slowTime: st.slowTime || 0,
    // Mortar shells fly toward where the target *is* and detonate there
    // (area damage) rather than homing on the target.
    arc: !!p.arc, tx: target.x, ty: target.y, t: 0, life: 0,
    trail: [],
  };
  if (proj.arc) {
    proj.sx = proj.x; proj.sy = proj.y;
    proj.total = Math.hypot(proj.tx - proj.x, proj.ty - proj.y) / proj.speed;
  }
  G.projectiles.push(proj);
  Audio.shoot(t.type);
}

function updateProjectiles(dt) {
  for (const p of G.projectiles) {
    p.life += dt;
    if (p.trail.length > 6) p.trail.shift();
    p.trail.push({ x: p.x, y: p.y });

    if (p.arc) {
      // Parametric lob: lerp along the ground, add a parabolic height.
      p.t += dt;
      const k = Math.min(1, p.t / p.total);
      p.x = p.sx + (p.tx - p.sx) * k;
      p.y = p.sy + (p.ty - p.sy) * k;
      p.h = Math.sin(k * Math.PI) * 40;
      if (k >= 1) { explode(p); p.dead = true; }
      continue;
    }

    // Homing projectile: chase the target; if it died, fly straight on
    // and expire after a short while.
    if (p.target && !p.target.dead) { p.tx = p.target.x; p.ty = p.target.y; }
    const dx = p.tx - p.x, dy = p.ty - p.y;
    const d = Math.hypot(dx, dy);
    const step = p.speed * dt;
    if (d <= step + (p.target && !p.target.dead ? p.target.radius : 0)) {
      if (p.target && !p.target.dead) hit(p, p.target);
      p.dead = true;
    } else {
      p.x += dx / d * step; p.y += dy / d * step;
      if (p.life > 2.5) p.dead = true;
    }
  }
  G.projectiles = G.projectiles.filter(p => !p.dead);
}

function hit(p, e) {
  if (p.slow) {
    if (p.slow > e.slow || e.slowTimer < 0.3) { e.slow = p.slow; e.slowTimer = p.slowTime; }
    spawnParticles(e.x, e.y, '#bff6ff', 4, 50);
  } else {
    spawnParticles(p.x, p.y, p.color, 3, 60);
  }
  damageEnemy(e, p.damage, p.tower);
}

function explode(p) {
  spawnParticles(p.x, p.y, '#ffb59e', 18, 120);
  spawnParticles(p.x, p.y, '#ffe6a3', 6, 40);
  G.particles.push({ x: p.x, y: p.y, ring: true, r: 4, maxR: p.splash, life: 0.25, maxLife: 0.25, color: '#ff9b7a' });
  const r2 = p.splash * p.splash;
  // Snapshot: killing a splitter pushes new enemies into G.enemies, and
  // those should not be caught by the same blast.
  for (const e of G.enemies.slice()) {
    if (e.dead) continue;
    const dx = e.x - p.x, dy = e.y - p.y;
    if (dx * dx + dy * dy <= r2) damageEnemy(e, p.damage, p.tower);
  }
}

function spawnParticles(x, y, color, n, speed = 90) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.4 + Math.random() * 0.8);
    G.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.35 + Math.random() * 0.35, maxLife: 0.7, size: 1.5 + Math.random() * 2.5, color,
    });
  }
}

function updateParticles(dt) {
  for (const p of G.particles) {
    p.life -= dt;
    if (p.ring) { p.r += (p.maxR - p.r) * Math.min(1, dt * 14); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.92; p.vy *= 0.92;
  }
  G.particles = G.particles.filter(p => p.life > 0);
  for (const f of G.floaters) { f.life -= dt; f.y -= 28 * dt; }
  G.floaters = G.floaters.filter(f => f.life > 0);
}

function floater(x, y, text, color) {
  G.floaters.push({ x, y, text, color, life: 0.9 });
}

const tileFlashes = [];
function flashTile(gx, gy) { tileFlashes.push({ gx, gy, life: 0.35 }); }

/* ---------------------------------------------------------------------
 * 8. RENDERING
 * ------------------------------------------------------------------- */
function render() {
  ctx.save();
  if (G.shake > 0) {
    const s = G.shake * 6;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }
  drawMap();
  drawTileFlashes();
  drawPlacementPreview();
  drawTowers();
  drawEnemies();
  drawProjectiles();
  drawParticles();
  drawRangeIndicator();
  drawFloaters();
  ctx.restore();
  drawBanner();
}

function drawMap() {
  // Buildable tiles: checkerboard grass. Path: dirt with a subtle centre line.
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const onPath = G.pathSet.has(`${x},${y}`);
      if (onPath) {
        ctx.fillStyle = '#5b4a3a';
      } else {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#243a2e' : '#213528';
      }
      ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
    }
  }
  // Path edge & direction dashes
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 1;
  for (const [x, y] of G.path) ctx.strokeRect(x * TILE + 0.5, y * TILE + 0.5, TILE - 1, TILE - 1);

  ctx.save();
  ctx.strokeStyle = 'rgba(255,230,180,0.18)';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.setLineDash([10, 14]);
  ctx.lineDashOffset = -(G.time * 30) % 24;
  ctx.beginPath();
  G.waypoints.forEach((w, i) => i ? ctx.lineTo(w.x, w.y) : ctx.moveTo(w.x, w.y));
  ctx.stroke();
  ctx.restore();

  // Start marker
  const s = G.waypoints[0];
  ctx.fillStyle = '#c95d5d';
  ctx.beginPath(); ctx.arc(s.x, s.y, 9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('IN', s.x, s.y);

  // Base marker
  const b = G.waypoints[G.waypoints.length - 1];
  ctx.fillStyle = '#2f6fd6';
  ctx.fillRect(b.x - 13, b.y - 13, 26, 26);
  ctx.fillStyle = '#9dc4ff';
  ctx.fillRect(b.x - 9, b.y - 9, 18, 18);
  ctx.fillStyle = '#123';
  ctx.fillText('B', b.x, b.y + 1);
  // Lives pips near base
  ctx.fillStyle = G.lives <= 5 ? '#ff5d5d' : '#9dc4ff';
  ctx.font = 'bold 10px system-ui';
  ctx.fillText('♥ ' + G.lives, b.x, b.y - 20);
}

function drawTileFlashes() {
  for (const f of tileFlashes) {
    ctx.fillStyle = `rgba(255,80,80,${f.life * 1.4})`;
    ctx.fillRect(f.gx * TILE, f.gy * TILE, TILE, TILE);
  }
}

function drawPlacementPreview() {
  if (!G.selectedType || G.over) return;
  const { x: gx, y: gy } = G.hover;
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return;
  const def = TOWER_TYPES[G.selectedType];
  const ok = canBuildAt(gx, gy) && G.gold >= def.cost;
  const cx = gx * TILE + TILE / 2, cy = gy * TILE + TILE / 2;
  // range ring
  ctx.beginPath(); ctx.arc(cx, cy, def.tiers[0].range, 0, Math.PI * 2);
  ctx.fillStyle = ok ? 'rgba(90,169,255,0.10)' : 'rgba(255,93,93,0.10)';
  ctx.fill();
  ctx.strokeStyle = ok ? 'rgba(90,169,255,0.6)' : 'rgba(255,93,93,0.6)';
  ctx.setLineDash([4, 4]); ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
  // tile highlight
  ctx.fillStyle = ok ? 'rgba(76,209,122,0.35)' : 'rgba(255,93,93,0.35)';
  ctx.fillRect(gx * TILE, gy * TILE, TILE, TILE);
  // ghost tower
  ctx.globalAlpha = 0.6;
  drawTowerShape(G.selectedType, cx, cy, -Math.PI / 2, 0, 0);
  ctx.globalAlpha = 1;
  if (!ok) {
    ctx.strokeStyle = '#ff5d5d'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx - 8, cy - 8); ctx.lineTo(cx + 8, cy + 8);
    ctx.moveTo(cx + 8, cy - 8); ctx.lineTo(cx - 8, cy + 8);
    ctx.stroke();
  }
}

function drawTowerShape(type, x, y, angle, level, recoil) {
  const def = TOWER_TYPES[type];
  // base plate
  ctx.fillStyle = '#2b3140';
  ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#444c60'; ctx.lineWidth = 2; ctx.stroke();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  const kick = -recoil * 3;
  if (type === 'basic') {
    ctx.fillStyle = def.color;
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#dbe9ff';
    ctx.fillRect(kick, -3, 16, 6);
  } else if (type === 'sniper') {
    ctx.fillStyle = def.color;
    ctx.beginPath();
    ctx.moveTo(-8, -8); ctx.lineTo(4, -5); ctx.lineTo(4, 5); ctx.lineTo(-8, 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff0c9';
    ctx.fillRect(kick, -2, 22, 4);
  } else if (type === 'splash') {
    ctx.fillStyle = def.color;
    ctx.fillRect(-9, -9, 18, 18);
    ctx.fillStyle = '#ffd3c2';
    ctx.beginPath(); ctx.arc(kick + 2, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2b1a14';
    ctx.beginPath(); ctx.arc(kick + 2, 0, 3, 0, Math.PI * 2); ctx.fill();
  } else if (type === 'frost') {
    ctx.fillStyle = def.color;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      ctx.lineTo(Math.cos(a) * 10, Math.sin(a) * 10);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(kick, -2, 14, 4);
  }
  ctx.restore();

  // level pips
  for (let i = 0; i < level; i++) {
    ctx.fillStyle = '#f5b942';
    ctx.beginPath(); ctx.arc(x - 8 + i * 8, y + 16, 2.5, 0, Math.PI * 2); ctx.fill();
  }
}

function drawTowers() {
  for (const t of G.towers) {
    drawTowerShape(t.type, t.x, t.y, t.angle, t.level, Math.max(0, t.recoil));
    if (t === G.selectedTower) {
      ctx.strokeStyle = '#f5b942'; ctx.lineWidth = 2;
      ctx.strokeRect(t.gx * TILE + 2, t.gy * TILE + 2, TILE - 4, TILE - 4);
    }
  }
}

function drawEnemies() {
  for (const e of G.enemies) {
    const r = e.radius;
    const bob = Math.sin(e.wobble) * 1.2;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(e.x, e.y + r * 0.7, r * 0.9, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    // body
    ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : e.def.color;
    ctx.beginPath();
    if (e.type === 'tank' || e.type === 'boss') {
      ctx.rect(e.x - r, e.y - r + bob, r * 2, r * 2);
    } else if (e.type === 'fast') {
      ctx.moveTo(e.x + r, e.y + bob); ctx.lineTo(e.x - r, e.y - r * 0.8 + bob); ctx.lineTo(e.x - r * 0.5, e.y + bob); ctx.lineTo(e.x - r, e.y + r * 0.8 + bob); ctx.closePath();
    } else {
      ctx.arc(e.x, e.y + bob, r, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    // slowed tint
    if (e.slow > 0) {
      ctx.fillStyle = 'rgba(127,231,255,0.45)';
      ctx.beginPath(); ctx.arc(e.x, e.y + bob, r + 2, 0, Math.PI * 2); ctx.fill();
    }
    // shield ring
    if (e.shield > 0) {
      ctx.strokeStyle = 'rgba(159,242,230,0.9)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y + bob, r + 4, 0, Math.PI * 2 * (e.shield / e.maxShield)); ctx.stroke();
    }
    // boss crown
    if (e.def.boss) {
      ctx.fillStyle = '#ffd86b';
      ctx.beginPath();
      ctx.moveTo(e.x - 8, e.y - r - 2 + bob); ctx.lineTo(e.x - 5, e.y - r - 9 + bob); ctx.lineTo(e.x - 2, e.y - r - 3 + bob);
      ctx.lineTo(e.x, e.y - r - 10 + bob); ctx.lineTo(e.x + 2, e.y - r - 3 + bob); ctx.lineTo(e.x + 5, e.y - r - 9 + bob);
      ctx.lineTo(e.x + 8, e.y - r - 2 + bob); ctx.closePath(); ctx.fill();
    }
    // health bar
    const bw = e.def.boss ? 44 : Math.max(20, r * 2.2), bh = e.def.boss ? 6 : 4;
    const bx = e.x - bw / 2, by = e.y - r - (e.def.boss ? 18 : 9) + bob;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    const frac = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = frac > 0.5 ? '#4cd17a' : frac > 0.25 ? '#f5b942' : '#ff5d5d';
    ctx.fillRect(bx, by, bw * frac, bh);
  }
}

function drawProjectiles() {
  for (const p of G.projectiles) {
    const h = p.arc ? p.h : 0;
    // trail
    if (p.trail.length > 1) {
      ctx.strokeStyle = p.color; ctx.lineWidth = p.radius * 0.8; ctx.globalAlpha = 0.35;
      ctx.beginPath();
      p.trail.forEach((q, i) => i ? ctx.lineTo(q.x, q.y - (p.arc ? p.h : 0)) : ctx.moveTo(q.x, q.y - (p.arc ? p.h : 0)));
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (p.arc) {
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y - h, p.radius, 0, Math.PI * 2); ctx.fill();
  }
}

function drawParticles() {
  for (const p of G.particles) {
    const a = Math.max(0, p.life / p.maxLife);
    if (p.ring) {
      ctx.strokeStyle = p.color; ctx.globalAlpha = a; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawRangeIndicator() {
  // Selected tower always shows range; hovered tower shows when not placing.
  let t = G.selectedTower;
  if (!t && !G.selectedType && G.hover.x >= 0 && G.hover.y >= 0 && G.hover.x < COLS && G.hover.y < ROWS) {
    t = G.grid[G.hover.y][G.hover.x];
  }
  if (!t) return;
  const st = towerStats(t);
  ctx.beginPath(); ctx.arc(t.x, t.y, st.range, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(245,185,66,0.08)'; ctx.fill();
  ctx.strokeStyle = 'rgba(245,185,66,0.7)'; ctx.lineWidth = 1.5; ctx.stroke();
  if (st.splash) {
    ctx.setLineDash([3, 3]);
    ctx.strokeStyle = 'rgba(255,122,89,0.5)';
    ctx.beginPath(); ctx.arc(t.x, t.y, st.splash, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawFloaters() {
  ctx.font = 'bold 12px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of G.floaters) {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawBanner() {
  if (G.paused && !G.over && G.started) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 28px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = '13px system-ui'; ctx.fillStyle = '#c9d0de';
    ctx.fillText('Press P or the pause button to resume', W / 2, H / 2 + 26);
  } else if (G.started && !G.waveActive && !G.over && G.wave === 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(W / 2 - 200, H - 42, 400, 30);
    ctx.fillStyle = '#fff'; ctx.font = '13px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Place towers on the grass, then press Start Wave (or Space).', W / 2, H - 27);
  }
}

/* ---------------------------------------------------------------------
 * 9. INPUT & UI
 * ------------------------------------------------------------------- */
const $ = id => document.getElementById(id);
const ui = {
  gold: $('ui-gold'), lives: $('ui-lives'), wave: $('ui-wave'), best: $('ui-best'),
  btnWave: $('btn-wave'), btnSpeed: $('btn-speed'), btnPause: $('btn-pause'),
  btnMute: $('btn-mute'), btnRestart: $('btn-restart'),
  towerList: $('tower-list'), infoTitle: $('info-title'), infoBody: $('info-body'),
  preview: $('preview'), overlay: $('overlay'), ovTitle: $('ov-title'), ovSub: $('ov-sub'),
  ovScore: $('ov-score'), ovBest: $('ov-best'), ovBtn: $('ov-btn'), mapSelect: $('map-select'),
  toast: $('toast'),
};

let toastTimer = 0;
let uiPanelKey = '';     // what the info panel currently shows
let uiPreviewWave = -1;  // which wave the preview chips describe
function toast(msg) {
  ui.toast.textContent = msg;
  ui.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => ui.toast.classList.remove('show'), 1600);
}

function buildTowerButtons() {
  ui.towerList.innerHTML = '';
  for (const [type, def] of Object.entries(TOWER_TYPES)) {
    const b = document.createElement('button');
    b.className = 'tower-btn'; b.dataset.type = type;
    b.innerHTML = `<span class="swatch" style="background:${def.color}"></span>
      <span><div class="name">${def.name} <span class="hint">[${def.key}]</span></div><div class="desc">${def.desc}</div></span>
      <span class="cost">${def.cost}g</span>`;
    b.addEventListener('click', () => selectTowerType(G.selectedType === type ? null : type));
    ui.towerList.appendChild(b);
  }
}

function selectTowerType(type) {
  Audio.init();
  G.selectedType = type;
  if (type) G.selectedTower = null;
  updateUI();
}

function canvasToGrid(ev) {
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) * (canvas.width / rect.width);
  const y = (ev.clientY - rect.top) * (canvas.height / rect.height);
  return { x: Math.floor(x / TILE), y: Math.floor(y / TILE) };
}

canvas.addEventListener('mousemove', ev => { G.hover = canvasToGrid(ev); });
canvas.addEventListener('mouseleave', () => { G.hover = { x: -1, y: -1 }; });
canvas.addEventListener('contextmenu', ev => { ev.preventDefault(); selectTowerType(null); G.selectedTower = null; updateUI(); });
canvas.addEventListener('click', ev => {
  Audio.init();
  if (!G.started || G.over) return;
  const { x: gx, y: gy } = canvasToGrid(ev);
  if (gx < 0 || gy < 0 || gx >= COLS || gy >= ROWS) return;
  const existing = G.grid[gy][gx];
  if (G.selectedType) {
    if (existing) { G.selectedTower = existing; G.selectedType = null; updateUI(); return; }
    const placed = placeTower(G.selectedType, gx, gy);
    // Keep the tower type selected for rapid placement unless shift is not held & we can't afford another.
    if (placed && G.gold < TOWER_TYPES[G.selectedType].cost) G.selectedType = null;
    updateUI();
    return;
  }
  G.selectedTower = existing || null;
  updateUI();
});

document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'SELECT') return;
  const k = ev.key;
  if (k === 'Escape') { selectTowerType(null); G.selectedTower = null; updateUI(); }
  else if (k === ' ') { ev.preventDefault(); if (!G.started) return; if (ui.btnWave.disabled) return; startWave(); }
  else if (k === 'p' || k === 'P') togglePause();
  else if (k === 'f' || k === 'F') toggleSpeed();
  else if (k === 'u' || k === 'U') { if (G.selectedTower) upgradeTower(G.selectedTower); }
  else if (k === 's' || k === 'S') { if (G.selectedTower) sellTower(G.selectedTower); }
  else {
    for (const [type, def] of Object.entries(TOWER_TYPES)) if (def.key === k) selectTowerType(type);
  }
});

function togglePause() {
  if (!G.started || G.over) return;
  G.paused = !G.paused;
  updateUI();
}
function toggleSpeed() {
  G.speed = G.speed === 1 ? 2 : 1;
  updateUI();
}

ui.btnWave.addEventListener('click', () => { Audio.init(); startWave(); });
ui.btnSpeed.addEventListener('click', toggleSpeed);
ui.btnPause.addEventListener('click', togglePause);
ui.btnMute.addEventListener('click', () => { Audio.init(); Audio.muted = !Audio.muted; ui.btnMute.textContent = Audio.muted ? 'Sound: Off' : 'Sound: On'; });
ui.btnRestart.addEventListener('click', () => { showOverlay('start'); });
ui.ovBtn.addEventListener('click', () => {
  Audio.init();
  G.mapIndex = parseInt(ui.mapSelect.value, 10) || 0;
  resetGame();
  ui.overlay.classList.remove('show');
  updateUI();
});
MAPS.forEach((m, i) => {
  const o = document.createElement('option'); o.value = i; o.textContent = m.name;
  ui.mapSelect.appendChild(o);
});
ui.mapSelect.addEventListener('change', () => {
  // live preview the chosen map behind the overlay
  loadMap(parseInt(ui.mapSelect.value, 10) || 0);
});

function showOverlay(kind) {
  ui.overlay.classList.add('show');
  ui.mapSelect.value = String(G.mapIndex);
  if (kind === 'start') {
    ui.ovTitle.textContent = 'Gridlock Defense';
    ui.ovSub.textContent = 'Hold the line. Enemies follow the road to your base.';
    ui.ovScore.textContent = '';
    ui.ovBest.textContent = G.bestWave ? `Best wave this session: ${G.bestWave}` : '';
    ui.ovBtn.textContent = G.started ? 'Restart Game' : 'Start Game';
  } else {
    ui.ovTitle.textContent = 'Game Over';
    ui.ovSub.textContent = 'The base has fallen.';
    ui.ovScore.textContent = `You reached wave ${G.wave}`;
    ui.ovBest.textContent = G.wave >= G.bestWave && G.wave > 0 ? 'New best!' : `Best wave this session: ${G.bestWave}`;
    ui.ovBtn.textContent = 'Play Again';
  }
}

function gameOver() {
  if (G.over) return;
  G.over = true;
  G.waveActive = false;
  G.bestWave = Math.max(G.bestWave, G.wave);
  Audio.gameOver();
  updateUI();
  setTimeout(() => showOverlay('over'), 600);
}

function updateUI() {
  ui.gold.textContent = G.gold;
  ui.lives.textContent = G.lives;
  ui.wave.textContent = G.wave;
  ui.best.textContent = G.bestWave;
  ui.btnWave.textContent = G.waveActive ? `Wave ${G.wave} in progress` : `Start Wave ${G.wave + 1}`;
  ui.btnWave.disabled = G.waveActive || G.over || !G.started;
  ui.btnSpeed.textContent = G.speed + 'x';
  ui.btnPause.textContent = G.paused ? '▶' : 'II';
  ui.btnPause.disabled = G.over || !G.started;

  for (const b of ui.towerList.children) {
    const type = b.dataset.type;
    b.classList.toggle('selected', G.selectedType === type);
    b.disabled = G.gold < TOWER_TYPES[type].cost;
    if (b.disabled) b.classList.remove('selected');
  }

  // next-wave preview (rebuilt only when the wave number changes)
  if (uiPreviewWave !== G.wave + 1) {
    uiPreviewWave = G.wave + 1;
    const next = waveSummary(G.wave + 1);
    ui.preview.innerHTML = Object.entries(next)
      .map(([type, n]) => `<span class="chip"><i style="background:${ENEMY_TYPES[type].color}"></i>${ENEMY_TYPES[type].name} ×${n}</span>`)
      .join('');
  }

  // selected tower panel. The buttons are only rebuilt when the selection
  // or level changes; values that tick every kill (kills, affordability)
  // are patched in place so a click never lands on a replaced element.
  const t = G.selectedTower;
  let key;
  if (t) key = `tower|${t.id}|${t.level}`;
  else if (G.selectedType) key = `place|${G.selectedType}`;
  else key = 'idle';
  if (key !== uiPanelKey) {
    uiPanelKey = key;
    if (t) {
      const def = TOWER_TYPES[t.type];
      const st = towerStats(t);
      const maxed = t.level >= def.tiers.length - 1;
      const nextTier = maxed ? null : def.tiers[t.level + 1];
      const refund = Math.round(towerValue(t) * SELL_REFUND);
      ui.infoTitle.textContent = `${def.name} — Lv ${t.level + 1}/${def.tiers.length}`;
      const line = (label, cur, nxt, fmt = v => v) =>
        `<div class="kv"><span>${label}</span><b>${fmt(cur)}${nxt != null && nxt !== cur ? ` <span style="color:var(--good)">→ ${fmt(nxt)}</span>` : ''}</b></div>`;
      let html = '';
      html += line('Damage', st.damage, nextTier && nextTier.damage);
      html += line('Range', st.range, nextTier && nextTier.range);
      html += line('Fire rate', st.fireRate, nextTier && nextTier.fireRate, v => v.toFixed(1) + '/s');
      if (st.splash) html += line('Splash radius', st.splash, nextTier && nextTier.splash);
      if (st.slow) html += line('Slow', st.slow, nextTier && nextTier.slow, v => Math.round(v * 100) + '%');
      html += `<div class="kv"><span>Kills</span><b id="info-kills">${t.kills}</b></div>`;
      html += `<div class="row" style="margin-top:8px;">
        <button id="btn-upgrade" class="primary" ${maxed ? 'disabled' : ''}>${maxed ? 'Max level' : `Upgrade (${nextTier.cost}g)`}</button>
        <button id="btn-sell" class="danger">Sell (+${refund}g)</button>
      </div>
      <div class="hint" style="margin-top:6px;"><kbd>U</kbd> upgrade · <kbd>S</kbd> sell · right-click to deselect</div>`;
      ui.infoBody.innerHTML = html;
      $('btn-upgrade').addEventListener('click', () => upgradeTower(t));
      $('btn-sell').addEventListener('click', () => sellTower(t));
    } else if (G.selectedType) {
      const def = TOWER_TYPES[G.selectedType];
      const st = def.tiers[0];
      ui.infoTitle.textContent = `Placing: ${def.name}`;
      ui.infoBody.innerHTML = `
        <div class="kv"><span>Cost</span><b>${def.cost}g</b></div>
        <div class="kv"><span>Damage</span><b>${st.damage}</b></div>
        <div class="kv"><span>Range</span><b>${st.range}</b></div>
        <div class="kv"><span>Fire rate</span><b>${st.fireRate.toFixed(1)}/s</b></div>
        ${st.splash ? `<div class="kv"><span>Splash radius</span><b>${st.splash}</b></div>` : ''}
        ${st.slow ? `<div class="kv"><span>Slow</span><b>${Math.round(st.slow * 100)}%</b></div>` : ''}
        <div class="hint" style="margin-top:6px;">Click a green tile to build. Right-click or <kbd>Esc</kbd> to cancel.</div>`;
    } else {
      ui.infoTitle.textContent = 'Selected';
      ui.infoBody.innerHTML = 'Click a placed tower to inspect, upgrade or sell it. Hover a tower to see its range.';
    }
  }
  if (t) {
    const def = TOWER_TYPES[t.type];
    const maxed = t.level >= def.tiers.length - 1;
    const k = $('info-kills'); if (k) k.textContent = t.kills;
    const up = $('btn-upgrade'); if (up) up.disabled = maxed || G.gold < def.tiers[t.level + 1].cost;
  }
}

/* ---------------------------------------------------------------------
 * 10. GAME LOOP
 *   requestAnimationFrame with a fixed-ish timestep: we clamp dt so a
 *   backgrounded tab doesn't teleport enemies, and run the sim multiple
 *   times when speed is 2x so physics stay identical at any speed.
 * ------------------------------------------------------------------- */
let last = performance.now();

function step(dt) {
  G.time += dt;
  if (G.shake > 0) G.shake -= dt;
  for (const f of tileFlashes) f.life -= dt;
  for (let i = tileFlashes.length - 1; i >= 0; i--) if (tileFlashes[i].life <= 0) tileFlashes.splice(i, 1);

  // Spawner
  if (G.waveActive && G.spawnQueue.length) {
    G.spawnTimer -= dt;
    while (G.spawnTimer <= 0 && G.spawnQueue.length) {
      const next = G.spawnQueue.shift();
      spawnEnemy(next.type);
      G.spawnTimer += next.delay;
    }
  }

  updateEnemies(dt);
  if (G.over) return;
  updateTowers(dt);
  updateProjectiles(dt);
  updateParticles(dt);

  // Wave complete?
  if (G.waveActive && !G.spawnQueue.length && G.enemies.length === 0) {
    G.waveActive = false;
    const bonus = 20 + G.wave * 5;
    G.gold += bonus;
    G.bestWave = Math.max(G.bestWave, G.wave);
    floater(W / 2, H / 2 - 40, `Wave ${G.wave} cleared! +${bonus}g`, '#4cd17a');
    updateUI();
  }
}

let frameCount = 0;
let lastError = '';

function frame(now) {
  frameCount++;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;
  if (dt < 0) dt = 0;
  try {
    if (G.started && !G.paused && !G.over) {
      const sub = 1 / 120;
      let total = dt * G.speed;
      while (total > 0) { const s = Math.min(sub, total); step(s); total -= s; }
    } else if (!G.started) {
      G.time += dt; // keep the path dashes animating on the title screen
    }
    render();
  } catch (err) {
    // A bug in one frame must never stop the game: report it and carry on.
    const msg = String(err && err.message || err);
    if (msg !== lastError) { lastError = msg; console.error(err); toast('Recovered from an error: ' + msg); }
  }
  requestAnimationFrame(frame);
}

// Watchdog: if the browser ever drops the animation-frame chain (it can
// happen after a long tab suspension), restart it.
let watchdogSeen = -1;
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  if (frameCount === watchdogSeen) { last = performance.now(); requestAnimationFrame(frame); }
  watchdogSeen = frameCount;
}, 1500);

// After a tab switch, don't let the first frame back count the whole absence.
document.addEventListener('visibilitychange', () => { last = performance.now(); });

// ---- boot ----
loadMap(0);
buildTowerButtons();
updateUI();
showOverlay('start');
requestAnimationFrame(frame);
</script>
</body>
</html>
